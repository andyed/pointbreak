<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pointbreak — web-three mesh renderer</title>
<link rel="stylesheet" href="css/style.css">
<!-- import map so OrbitControls' bare `import ... from 'three'` resolves to
     the vendored module (same pinned release; see vendor/VENDOR.md) -->
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>
<canvas id="gl"></canvas>
<div id="nogl">WebGL2 required.</div>

<div id="titlebar">
  pointbreak <span class="tag">web-three M3</span>
  <small>shaded mesh, shared model · 1–7 presets · V camera · S surfer · C section · B bed A/B · [ ] tide · , . station · space pause · H hide</small>
</div>

<div id="hud">
  <span class="k">preset</span> <span id="hudPreset" class="v">—</span>
  <span class="k">camera</span> <span id="hudCam" class="v">—</span>
  <!-- same .k/.v colors as above: 9.6:1 worst-case, documented in style.css -->
  <span class="k">surfer</span> <span id="hudSurfer" class="v">off</span>
  <span class="k">stage</span> <span id="hudGeo" class="v geo">—</span>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
