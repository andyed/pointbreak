-->

<title>The down-point gradient at Pleasure Point</title>
<desc>Three aligned strips along Pleasure Point's down-point coordinate u (meters from the
apex): reef elevation (NAVD88), coastal exposure (coast tangent, degrees), and the seven-spot
skill ladder from Private's to Sewers, with shared vertical gridlines tying spot position to
depth and exposure.</desc>
<style>
  .bg { fill: var(--mg-bg, #0f1216); }
  .fg-text { fill: var(--mg-fg, #e6e4d2); font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
  .foam-text { fill: var(--mg-foam, #eef2f3); font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
  .foam-dim-text { fill: var(--mg-foam-dim, #d8dcdd); font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
  .sand-text { fill: var(--mg-sand, #c9a86a); font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
  .title { font-size: 27px; font-weight: 700; letter-spacing: 0.3px; }
  .subtitle { font-size: 16px; }
  .strip-label { font-size: 18px; font-weight: 700; letter-spacing: 1.5px; }
  .axis-label { font-size: 16px; }
  .spot-name { font-size: 18px; font-weight: 700; }
  .spot-caption { font-size: 16px; }
  .stage-label { font-size: 16px; font-weight: 700; }
  .annot { font-size: 16px; }
  .u-axis { font-size: 16px; }
  .teal-line { stroke: var(--mg-teal, #4a8f85); }
  .teal-fill { fill: var(--mg-teal, #4a8f85); }
  .slate-line { stroke: var(--mg-slate, #6b7f8c); }
  .grid-line { stroke: var(--mg-slate, #6b7f8c); stroke-width: 1; stroke-dasharray: 2 4; opacity: 0.45; }
  .kelp-fill { fill: var(--mg-kelp, #1d2b28); }
  .sand-line { stroke: var(--mg-sand, #c9a86a); }
</style>
<rect class="bg" x="0" y="0" width="1200" height="882"/>


<text class="fg-text title" font-family="Georgia, 'Times New Roman', serif" x="40" y="34.0">THE DOWN-POINT GRADIENT — one point, seven breaks</text>
<text class="fg-text subtitle" x="40" y="56.0">Pleasure Point, u = down-point arclength from the apex (m). Same u-axis, three strips: what&#8217;s under you, how exposed you are, who you become.</text>

