WCAG contrast ratios computed for this figure (see gen_ladder.py):
  cream(#e6e4d2) on bg(#0f1216): 14.66:1  [PASS >=8:1]
  foam(#eef2f3) on bg(#0f1216): 16.66:1  [PASS >=8:1]
  cream(#e6e4d2) on kelp(#1d2b28): 11.48:1  [PASS >=8:1]
  foam(#eef2f3) on kelp(#1d2b28): 13.04:1  [PASS >=8:1]
