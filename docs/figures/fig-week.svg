<!-- 7 The Slot — alpha 35, meanest -->
<g>
  <clipPath id="clip7"><rect x="808" y="318" width="373" height="115.4" rx="3"/></clipPath>
  <g clip-path="url(#clip7)">
    <svg x="808" y="318" width="373" height="115.4" viewBox="0 162 640 198" preserveAspectRatio="xMidYMid slice">
      <image href="assets/cliff_theslot.png" x="0" y="0" width="640" height="360"/>
