<!-- 6 Middle Peak — alpha 45 (A-frame) -->
<g>
  <clipPath id="clip6"><rect x="417" y="318" width="373" height="115.4" rx="3"/></clipPath>
  <g clip-path="url(#clip6)">
    <svg x="417" y="318" width="373" height="115.4" viewBox="0 162 640 198" preserveAspectRatio="xMidYMid slice">
      <image href="assets/cliff_middlepeak.png" x="0" y="0" width="640" height="360"/>
