<svg viewBox="0 0 1616 818" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img">
<title>Seven Pleasure Point sites as simulated wave-character studies</title>
<desc>Cliff-view frames from the pointbreak model, one per site, ordered apex to down-point, each labelled with the parameters the model ran.</desc>
<style>
 .wk-bg { fill: #0f1216; }
 .wk-title { fill: #e6e4d2; font: 700 27px Georgia, "Times New Roman", serif; }
 .wk-sub { fill: #eef2f3; font: 400 15px -apple-system, "Helvetica Neue", Arial, sans-serif; }
 .wk-name { fill: #eef2f3; font: 700 19px -apple-system, "Helvetica Neue", Arial, sans-serif; }
 .wk-spec { fill: #e6e4d2; font: 400 14.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
 .wk-read { fill: #cccbbb; font: italic 400 14.5px -apple-system, "Helvetica Neue", Arial, sans-serif; }
 .wk-foot { fill: #cccbbb; font: 400 14px -apple-system, "Helvetica Neue", Arial, sans-serif; }
 .wk-badge { fill: #c9a86a; }
 .wk-badge-t { fill: #0f1216; font: 700 12px -apple-system, "Helvetica Neue", Arial, sans-serif; letter-spacing: .07em; }
 .wk-rule { stroke: rgba(230,228,210,0.18); stroke-width: 1; }
 .wk-frame { fill: none; stroke: rgba(230,228,210,0.20); stroke-width: 1; }
</style>
<rect class="wk-bg" x="0" y="0" width="1616" height="818"/>
<text class="wk-title" x="40" y="58">SEVEN SITES — one point, apex to down-point</text>
<rect class="wk-badge" x="1340" y="42" width="236" height="22" rx="3"/>
<text class="wk-badge-t" x="1351" y="57">WORK-IN-PROGRESS RENDER</text>
<text class="wk-sub" x="40" y="84">Simulated frames from the pointbreak model — not photographs, and not validated against this break.</text>
<clipPath id="wk-clip0"><rect x="40" y="100" width="366" height="206" rx="3"/></clipPath>
<g clip-path="url(#wk-clip0)"><svg x="40" y="100" width="366" height="206" viewBox="141.1 79.2 997.8 561.6" preserveAspectRatio="xMidYMid slice"><image xlink:href="assets/cliff_sewers.png" href="assets/cliff_sewers.png" x="0" y="0" width="1280" height="720"/></svg></g>
<rect class="wk-frame" x="40" y="100" width="366" height="206" rx="3"/>
<circle cx="62" cy="122" r="13" fill="#1d2b28" stroke="#c9a86a" stroke-width="1.5"/>
<text x="62" y="127" text-anchor="middle" fill="#eef2f3" font="700 14px sans-serif" font-size="14" font-weight="700" font-family="-apple-system, sans-serif">1</text>
<text class="wk-name" x="40" y="332">Sewers</text>
<line class="wk-rule" x1="40" y1="341" x2="406" y2="341"/>
<text class="wk-spec" x="40" y="362">α38° · ξ1.15 · σ0.4 · T15s · H0 2.2m</text>
<text class="wk-read" x="40" y="384">hollow plunging lip, heavy</text>
<text class="wk-read" x="40" y="404">sectioning at the apex</text>
<clipPath id="wk-clip1"><rect x="430" y="100" width="366" height="206" rx="3"/></clipPath>
<g clip-path="url(#wk-clip1)"><svg x="430" y="100" width="366" height="206" viewBox="141.1 79.2 997.8 561.6" preserveAspectRatio="xMidYMid slice"><image xlink:href="assets/cliff_firstpeak.png" href="assets/cliff_firstpeak.png" x="0" y="0" width="1280" height="720"/></svg></g>
<rect class="wk-frame" x="430" y="100" width="366" height="206" rx="3"/>
<circle cx="452" cy="122" r="13" fill="#1d2b28" stroke="#c9a86a" stroke-width="1.5"/>
<text x="452" y="127" text-anchor="middle" fill="#eef2f3" font="700 14px sans-serif" font-size="14" font-weight="700" font-family="-apple-system, sans-serif">2</text>
<text class="wk-name" x="430" y="332">First Peak</text>
<line class="wk-rule" x1="430" y1="341" x2="796" y2="341"/>
<text class="wk-spec" x="430" y="362">α50° · ξ0.85 · σ0.25 · T14s · H0 1.8m</text>
<text class="wk-read" x="430" y="384">steeper tapered wall,</text>
<text class="wk-read" x="430" y="404">crumble building toward a lip</text>
<clipPath id="wk-clip2"><rect x="820" y="100" width="366" height="206" rx="3"/></clipPath>
<g clip-path="url(#wk-clip2)"><svg x="820" y="100" width="366" height="206" viewBox="141.1 79.2 997.8 561.6" preserveAspectRatio="xMidYMid slice"><image xlink:href="assets/cliff_secondpeak.png" href="assets/cliff_secondpeak.png" x="0" y="0" width="1280" height="720"/></svg></g>
<rect class="wk-frame" x="820" y="100" width="366" height="206" rx="3"/>
<circle cx="842" cy="122" r="13" fill="#1d2b28" stroke="#c9a86a" stroke-width="1.5"/>
<text x="842" y="127" text-anchor="middle" fill="#eef2f3" font="700 14px sans-serif" font-size="14" font-weight="700" font-family="-apple-system, sans-serif">3</text>
<text class="wk-name" x="820" y="332">Second Peak</text>
<line class="wk-rule" x1="820" y1="341" x2="1186" y2="341"/>
<text class="wk-spec" x="820" y="362">α41° · ξ0.65 · σ0.15 · T14s · H0 1.5m</text>
<text class="wk-read" x="820" y="384">glassy shoulder, mellow</text>
<text class="wk-read" x="820" y="404">crumble at the pocket</text>
<clipPath id="wk-clip3"><rect x="1210" y="100" width="366" height="206" rx="3"/></clipPath>
<g clip-path="url(#wk-clip3)"><svg x="1210" y="100" width="366" height="206" viewBox="141.1 79.2 997.8 561.6" preserveAspectRatio="xMidYMid slice"><image xlink:href="assets/cliff_jacks.png" href="assets/cliff_jacks.png" x="0" y="0" width="1280" height="720"/></svg></g>
<rect class="wk-frame" x="1210" y="100" width="366" height="206" rx="3"/>
<circle cx="1232" cy="122" r="13" fill="#1d2b28" stroke="#c9a86a" stroke-width="1.5"/>
<text x="1232" y="127" text-anchor="middle" fill="#eef2f3" font="700 14px sans-serif" font-size="14" font-weight="700" font-family="-apple-system, sans-serif">4</text>
<text class="wk-name" x="1210" y="332">Jack&#39;s (38th)</text>
<line class="wk-rule" x1="1210" y1="341" x2="1576" y2="341"/>
<text class="wk-spec" x="1210" y="362">α37° · ξ0.5 · σ0.1 · T13s · H0 1.1m</text>
<text class="wk-read" x="1210" y="384">soft crumble along the face,</text>
<text class="wk-read" x="1210" y="404">light peel, rare section</text>
<clipPath id="wk-clip4"><rect x="40" y="424" width="366" height="206" rx="3"/></clipPath>
<g clip-path="url(#wk-clip4)"><svg x="40" y="424" width="366" height="206" viewBox="141.1 79.2 997.8 561.6" preserveAspectRatio="xMidYMid slice"><image xlink:href="assets/cliff_thehook.png" href="assets/cliff_thehook.png" x="0" y="0" width="1280" height="720"/></svg></g>
<rect class="wk-frame" x="40" y="424" width="366" height="206" rx="3"/>
<circle cx="62" cy="446" r="13" fill="#1d2b28" stroke="#c9a86a" stroke-width="1.5"/>
<text x="62" y="451" text-anchor="middle" fill="#eef2f3" font="700 14px sans-serif" font-size="14" font-weight="700" font-family="-apple-system, sans-serif">5</text>
<text class="wk-name" x="40" y="656">The Hook</text>
<line class="wk-rule" x1="40" y1="665" x2="406" y2="665"/>
<text class="wk-spec" x="40" y="686">α41° · ξ0.8 · σ0.2 · T13s · H0 1.5m</text>
<text class="wk-read" x="40" y="708">curling lip at the pocket,</text>
<text class="wk-read" x="40" y="728">mixed crumble and section</text>
<clipPath id="wk-clip5"><rect x="430" y="424" width="366" height="206" rx="3"/></clipPath>
<g clip-path="url(#wk-clip5)"><svg x="430" y="424" width="366" height="206" viewBox="141.1 79.2 997.8 561.6" preserveAspectRatio="xMidYMid slice"><image xlink:href="assets/cliff_sharks.png" href="assets/cliff_sharks.png" x="0" y="0" width="1280" height="720"/></svg></g>
<rect class="wk-frame" x="430" y="424" width="366" height="206" rx="3"/>
<circle cx="452" cy="446" r="13" fill="#1d2b28" stroke="#c9a86a" stroke-width="1.5"/>
<text x="452" y="451" text-anchor="middle" fill="#eef2f3" font="700 14px sans-serif" font-size="14" font-weight="700" font-family="-apple-system, sans-serif">6</text>
<text class="wk-name" x="430" y="656">Sharks</text>
<line class="wk-rule" x1="430" y1="665" x2="796" y2="665"/>
<text class="wk-spec" x="430" y="686">α36° · ξ0.45 · σ0.1 · T13s · H0 1m</text>
<text class="wk-read" x="430" y="708">slow rolling shoulder,</text>
<text class="wk-read" x="430" y="728">wide mellow lines</text>
<clipPath id="wk-clip6"><rect x="820" y="424" width="366" height="206" rx="3"/></clipPath>
<g clip-path="url(#wk-clip6)"><svg x="820" y="424" width="366" height="206" viewBox="141.1 79.2 997.8 561.6" preserveAspectRatio="xMidYMid slice"><image xlink:href="assets/cliff_privates.png" href="assets/cliff_privates.png" x="0" y="0" width="1280" height="720"/></svg></g>
<rect class="wk-frame" x="820" y="424" width="366" height="206" rx="3"/>
<circle cx="842" cy="446" r="13" fill="#1d2b28" stroke="#c9a86a" stroke-width="1.5"/>
<text x="842" y="451" text-anchor="middle" fill="#eef2f3" font="700 14px sans-serif" font-size="14" font-weight="700" font-family="-apple-system, sans-serif">7</text>
<text class="wk-name" x="820" y="656">Privates</text>
<line class="wk-rule" x1="820" y1="665" x2="1186" y2="665"/>
<text class="wk-spec" x="820" y="686">α31° · ξ0.35 · σ0.05 · T12s · H0 0.7m</text>
<text class="wk-read" x="820" y="708">thin feathering crest,</text>
<text class="wk-read" x="820" y="728">barely spilling, sheltered</text>
<line class="wk-rule" x1="40" y1="770" x2="1576" y2="770"/>
<text class="wk-foot" x="40" y="792">α peel angle · ξ Iribarren (barrel-ness) · σ section noise · T period · H0 swell height. Six of the seven run on surveyed NCEI bathymetry; Privates runs on a synthetic stage and is labelled as such in the app.</text>
</svg>