  </g>
  <circle cx="835" cy="345" r="16" class="badge-fill"/>
  <text x="835" y="345" text-anchor="middle" dominant-baseline="central" class="sans badge-num" font-size="16">7</text>
  <line x1="808" y1="449" x2="1181" y2="449" class="rule"/>
  <text x="808" y="475" class="sans label ink">The Slot</text>
  <text x="808" y="499" class="mono spec ink">&#945;35&#176; &#183; &#958;1.3 &#183; &#963;0.5 &#183; T15s &#183; H0 2.4m</text>
  <text x="808" y="523" class="sans read ink">hollow plunging lip, heavy</text>
  <text x="808" y="543" class="sans read ink">sectioning, closeout-prone</text>
</g>

<!-- ================= 8th cell: title + legend + footnote card ================= -->
<g>
  <rect x="1199" y="310" width="373" height="375" rx="6" class="card"/>
  <rect x="1199" y="310" width="6" height="375" class="rule-sand" stroke="none" fill="var(--mg-sand, #c9a86a)"/>

  <text x="1223" y="360" class="titlemain foam" font-family="Georgia, 'Times New Roman', serif">SEVEN WAVES</text>
  <text x="1223" y="386" class="sans subtitle ink">the model's moods, mellow to mean</text>
  <line x1="1223" y1="402" x2="1548" y2="402" class="rule"/>

  <text x="1223" y="426" class="mono legend ink">&#945; &#8212; peel angle (deg)</text>
  <text x="1223" y="448" class="mono legend ink">&#958; &#8212; Iribarren (barrel-ness)</text>
  <text x="1223" y="470" class="mono legend ink">&#963; &#8212; section noise</text>
  <text x="1223" y="492" class="mono legend ink">T &#8212; period (s)</text>
  <text x="1223" y="514" class="mono legend ink">H0 &#8212; swell height (m)</text>
  <line x1="1223" y1="528" x2="1548" y2="528" class="rule"/>

  <text x="1223" y="550" class="sans footnote ink">Simulated wave-character studies from</text>
  <text x="1223" y="571" class="sans footnote ink">the pointbreak renderer's preset bank.</text>
  <text x="1223" y="592" class="sans footnote ink">Preset names predate the Pleasure Point</text>
  <text x="1223" y="613" class="sans footnote ink">spot canon (three are West Side waves);</text>
  <text x="1223" y="634" class="sans footnote ink">these frames claim wave character, not</text>
  <text x="1223" y="655" class="sans footnote ink">geography.</text>
</g>

</svg>
