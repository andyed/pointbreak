  </g>
  <circle cx="444" cy="345" r="16" class="badge-fill"/>
  <text x="444" y="345" text-anchor="middle" dominant-baseline="central" class="sans badge-num" font-size="16">6</text>
  <line x1="417" y1="449" x2="790" y2="449" class="rule"/>
  <text x="417" y="475" class="sans label ink">Middle Peak</text>
  <text x="417" y="499" class="mono spec ink">&#945;45&#176; &#183; &#958;1.1 &#183; &#963;0.3 &#183; T15s &#183; H0 2.2m</text>
  <text x="417" y="523" class="sans read ink">plunging A-frame peak, curling</text>
