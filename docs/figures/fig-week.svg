<svg viewBox="0 0 1600 705" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-week-title fig-week-desc">
<!--
  CONTRAST AUDIT (WCAG 2.x relative-luminance ratios, computed 2026-08-09):
    cream #e6e4d2 on bg #0f1216      -> 14.66:1  (labels, spec lines, read lines on photos/bg)
    foam  #eef2f3 on bg #0f1216      -> 16.66:1  (title on bg)
    cream #e6e4d2 on kelp #1d2b28    -> 11.48:1  (title-card body text)
    foam  #eef2f3 on kelp #1d2b28    -> 13.04:1  (title-card headline, badge numerals)
    sand  #c9a86a on bg  #0f1216     ->  8.31:1  (meets floor, but NOT used on kelp: 6.51:1 fails,
                                                   so sand is restricted to decorative rules/dots only,
                                                   never set as text here)
    teal  #4a8f85 on bg  #0f1216     ->  4.97:1  (fails 8:1 -> decorative rules/badges only, no text)
    slate #6b7f8c on bg  #0f1216     ->  4.51:1  (fails 8:1 -> decorative rules only, no text)
  All body/caption/label text in this figure uses cream or foam on bg or kelp (>=11.48:1).
  Photo captions sit on solid #0f1216 below the crop line, never directly over image pixels,
  so the ratios above hold without needing a scrim.
-->
<title id="fig-week-title">Seven Waves — the model's moods, mellow to mean</title>
<desc id="fig-week-desc">Contact sheet of seven simulated wave-character renders from the pointbreak preset bank, ordered by peel angle descending (mellowest first): Cowell's, Jack's, Second Peak, First Peak, The Hook, Middle Peak, The Slot. Each frame is cropped to its lower 55% (the water) to exclude on-screen HUD chrome, paired with its real alpha/xi/sections/T/H0 parameter values and a one-line honest read of the simulated wave character.</desc>

<style>
  :root {
    --mg-bg: #0f1216;
    --mg-fg: #e6e4d2;
    --mg-foam: #eef2f3;
    --mg-teal: #4a8f85;
    --mg-slate: #6b7f8c;
    --mg-kelp: #1d2b28;
    --mg-sand: #c9a86a;
  }
  .bg-fill   { fill: var(--mg-bg, #0f1216); }
  .kelp-fill { fill: var(--mg-kelp, #1d2b28); }
  .ink       { fill: var(--mg-fg, #e6e4d2); }
  .foam      { fill: var(--mg-foam, #eef2f3); }
  .rule      { stroke: var(--mg-slate, #6b7f8c); stroke-width: 1; opacity: 0.55; }
  .rule-sand { stroke: var(--mg-sand, #c9a86a); stroke-width: 2; opacity: 0.9; }
  .badge-fill{ fill: var(--mg-kelp, #1d2b28); stroke: var(--mg-sand, #c9a86a); stroke-width: 1; opacity: 0.96; }
  .badge-num { fill: var(--mg-foam, #eef2f3); font-weight: 700; }
  .card      { fill: var(--mg-kelp, #1d2b28); }
  .sans      { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  .mono      { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace; }
  .label     { font-size: 21px; font-weight: 700; letter-spacing: 0.2px; }
  .spec      { font-size: 16px; }
  .read      { font-size: 16px; font-style: italic; }
  .kicker    { font-size: 15px; font-weight: 600; letter-spacing: 1.4px; }
  .titlemain { font-size: 32px; font-weight: 800; letter-spacing: 1px; }
  .subtitle  { font-size: 18px; font-weight: 400; }
  .legend    { font-size: 16px; }
  .footnote  { font-size: 16px; }
</style>

<rect x="0" y="0" width="1600" height="705" class="bg-fill"/>

<!-- ============ image crop macro data ============
     source frames: 640x360 (downscaled from 1280x720 captures).
     lower 55% crop viewBox: y=162 (0.45*360) height=198 (0.55*360) -->

<!-- ================= ROW 1 (mellowest -> ) ================= -->

<!-- 1 Cowell's — alpha 70 -->
<g>
  <clipPath id="clip1"><rect x="26" y="33" width="373" height="115.4" rx="3"/></clipPath>
  <g clip-path="url(#clip1)">
    <svg x="26" y="33" width="373" height="115.4" viewBox="0 162 640 198" preserveAspectRatio="xMidYMid slice">
      <image href="assets/cliff_cowells.png" x="0" y="0" width="640" height="360"/>
    </svg>
  </g>
  <circle cx="53" cy="60" r="16" class="badge-fill"/>
  <text x="53" y="60" text-anchor="middle" dominant-baseline="central" class="sans badge-num" font-size="16">1</text>
  <line x1="26" y1="164" x2="399" y2="164" class="rule"/>
  <text x="26" y="190" class="sans label ink">Cowell's</text>
  <text x="26" y="214" class="mono spec ink">&#945;70&#176; &#183; &#958;0.35 &#183; &#963;0.05 &#183; T12s &#183; H0 0.7m</text>
  <text x="26" y="238" class="sans read ink">thin feathering crest, barely spilling,</text>
  <text x="26" y="258" class="sans read ink">almost no sectioning</text>
</g>

<!-- 2 Jack's — alpha 62 -->
<g>
  <clipPath id="clip2"><rect x="417" y="33" width="373" height="115.4" rx="3"/></clipPath>
  <g clip-path="url(#clip2)">
    <svg x="417" y="33" width="373" height="115.4" viewBox="0 162 640 198" preserveAspectRatio="xMidYMid slice">
      <image href="assets/cliff_jacks.png" x="0" y="0" width="640" height="360"/>
    </svg>
  </g>
  <circle cx="444" cy="60" r="16" class="badge-fill"/>
  <text x="444" y="60" text-anchor="middle" dominant-baseline="central" class="sans badge-num" font-size="16">2</text>
  <line x1="417" y1="164" x2="790" y2="164" class="rule"/>
  <text x="417" y="190" class="sans label ink">Jack's</text>
  <text x="417" y="214" class="mono spec ink">&#945;62&#176; &#183; &#958;0.5 &#183; &#963;0.1 &#183; T13s &#183; H0 1.1m</text>
  <text x="417" y="238" class="sans read ink">soft crumble along the face,</text>
  <text x="417" y="258" class="sans read ink">light peel, rare section</text>
</g>

<!-- 3 Second Peak — alpha 58 -->
<g>
  <clipPath id="clip3"><rect x="808" y="33" width="373" height="115.4" rx="3"/></clipPath>
  <g clip-path="url(#clip3)">
    <svg x="808" y="33" width="373" height="115.4" viewBox="0 162 640 198" preserveAspectRatio="xMidYMid slice">
      <image href="assets/cliff_secondpeak.png" x="0" y="0" width="640" height="360"/>
    </svg>
  </g>
  <circle cx="835" cy="60" r="16" class="badge-fill"/>
  <text x="835" y="60" text-anchor="middle" dominant-baseline="central" class="sans badge-num" font-size="16">3</text>
  <line x1="808" y1="164" x2="1181" y2="164" class="rule"/>
  <text x="808" y="190" class="sans label ink">Second Peak</text>
  <text x="808" y="214" class="mono spec ink">&#945;58&#176; &#183; &#958;0.65 &#183; &#963;0.15 &#183; T14s &#183; H0 1.5m</text>
  <text x="808" y="238" class="sans read ink">glassy shoulder, mellow crumble</text>
  <text x="808" y="258" class="sans read ink">at the pocket, longboard peel</text>
</g>

<!-- 4 First Peak — alpha 50 -->
<g>
  <clipPath id="clip4"><rect x="1199" y="33" width="373" height="115.4" rx="3"/></clipPath>
  <g clip-path="url(#clip4)">
    <svg x="1199" y="33" width="373" height="115.4" viewBox="0 162 640 198" preserveAspectRatio="xMidYMid slice">
      <image href="assets/cliff_firstpeak.png" x="0" y="0" width="640" height="360"/>
    </svg>
  </g>
  <circle cx="1226" cy="60" r="16" class="badge-fill"/>
  <text x="1226" y="60" text-anchor="middle" dominant-baseline="central" class="sans badge-num" font-size="16">4</text>
  <line x1="1199" y1="164" x2="1572" y2="164" class="rule"/>
  <text x="1199" y="190" class="sans label ink">First Peak</text>
  <text x="1199" y="214" class="mono spec ink">&#945;50&#176; &#183; &#958;0.85 &#183; &#963;0.25 &#183; T14s &#183; H0 1.8m</text>
  <text x="1199" y="238" class="sans read ink">steeper tapered wall, crumble</text>
  <text x="1199" y="258" class="sans read ink">building toward a lip</text>
</g>

<!-- ================= ROW 2 ( -> meanest) + title card ================= -->

<!-- 5 The Hook — alpha 48 -->
<g>
  <clipPath id="clip5"><rect x="26" y="318" width="373" height="115.4" rx="3"/></clipPath>
  <g clip-path="url(#clip5)">
    <svg x="26" y="318" width="373" height="115.4" viewBox="0 162 640 198" preserveAspectRatio="xMidYMid slice">
      <image href="assets/cliff_thehook.png" x="0" y="0" width="640" height="360"/>
    </svg>
  </g>
  <circle cx="53" cy="345" r="16" class="badge-fill"/>
  <text x="53" y="345" text-anchor="middle" dominant-baseline="central" class="sans badge-num" font-size="16">5</text>
  <line x1="26" y1="449" x2="399" y2="449" class="rule"/>
  <text x="26" y="475" class="sans label ink">The Hook</text>
  <text x="26" y="499" class="mono spec ink">&#945;48&#176; &#183; &#958;0.8 &#183; &#963;0.2 &#183; T13s &#183; H0 1.5m</text>
  <text x="26" y="523" class="sans read ink">curling lip at the pocket,</text>
  <text x="26" y="543" class="sans read ink">mixed crumble and section</text>
